{% extends "base.html" %}
{% block title %}Create account · Cost Analyzer{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Create an account</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]{3,30}" required autofocus>
      <span class="hint">3–30 characters: letters, numbers, dot, dash or underscore</span></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <span class="hint">At least 8 characters</span></label>
    <label>Confirm password <input type="password" name="confirm" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted small-gap">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</section>
{% endblock %}
